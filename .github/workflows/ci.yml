name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
    unit-tests-backend:
        runs-on: ubuntu-latest
        outputs:
          coverage: ${{ steps.unit-tests-backend.outputs.report }}
        steps:
            - uses: actions/checkout@v4
            
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                    go-version: '1.21'
                    cache-dependency-path: |
                        bugtracker-backend/go.sum

            - name: Install go-junit-report
              run: go install github.com/jstemmer/go-junit-report/v2@latest

            - name: Execute backend unit tests
              id: unit-tests-backend
              working-directory: ./bugtracker-backend
              run: |
                    go test -json -coverprofile=coverage.out -covermode=atomic ./... 
                    go tool cover -func=coverage.out -o coverage.txt

                    echo "##Go Test Coverage Report##" >> $GITHUB_STEP_SUMMARY
                    echo '```' >> $GITHUB_STEP_SUMMARY
                    cat coverage.txt >> $GITHUB_STEP_SUMMARY
                    echo '```' >> $GITHUB_STEP_SUMMARY

                    echo "report<<EOF" >> $GITHUB_OUTPUT
                    cat coverage.txt >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT

                    go test -v ./... 2>&1 | go-junit-report > test-results.xml

            - name: Publish Backend Test Results
              if: always()
              uses: dorny/test-reporter@v1
              with:
                    name: Backend Unit Tests Report
                    path: bugtracker-backend/test-results.xml
                    reporter: jest-junit

    unit-tests-frontend:
        runs-on: ubuntu-latest
        outputs:
          report: ${{ steps.unit-tests-frontend.outputs.report }}
        steps:
            - uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                    node-version: '24'
                    cache: 'npm'
                    cache-dependency-path: |
                        bugtracker-frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./bugtracker-frontend
              run: npm ci

            - name: Execute frontend unit tests
              id: unit-tests-frontend
              working-directory: ./bugtracker-frontend
              run: |
                npm test | tee full_output.txt

                echo "##Frontend Test Report##" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat full_output.txt >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY

                echo "report<<EOF" >> $GITHUB_OUTPUT
                cat full_output.txt >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Publish Frontend Test Results
              if: always()
              uses: dorny/test-reporter@v1
              with:
                    name: Frontend Unit Tests Report
                    path: bugtracker-frontend/test-results.xml
                    reporter: jest-junit

    create-coverage-comment:
        if: github.event_name == 'pull_request'
        needs: [unit-tests-backend]
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - name: Create Coverage Comment
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ github.event.pull_request.number }}
                body: |
                    ## Backend Test Coverage Report ##
                    ```
                    ${{ needs.unit-tests-backend.outputs.coverage }}
                    ```
            - name: Create Frontend Test Report Comment
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ github.event.pull_request.number }}
                body: |
                    ## Frontend Test Report ##
                    ```
                    ${{ steps.unit-tests-frontend.outputs.report }}
                    ```